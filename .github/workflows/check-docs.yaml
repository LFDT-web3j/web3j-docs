name: Check documentation

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned documentation tools
        run: python -m pip install -r requirements.txt
      - name: Build and validate navigation and internal anchors
        run: mkdocs build --strict
      - name: Check release versions and rendered links
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_docs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: examples/pom.xml
      - name: Compile and test the published examples
        run: mvn -B -f examples/pom.xml verify
      - name: Save documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: Check external article links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --no-progress build/external-links.txt
          output: build/link-check.md
          fail: true
          failIfEmpty: true
      - name: Save link-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-link-report
          path: |
            build/link-check.md
            build/link-sources.json
          retention-days: 7
