name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-publish-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/check-docs.yaml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the validated documentation tools
        run: python -m pip install -r requirements.txt
      - name: Read documentation version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import yaml
          config = yaml.safe_load(open('mkdocs.yml'))
          print('DOCS_VERSION=' + str(config['extra']['web3j']['version']))
          PY
      - name: Set publishing identity
        run: |
          git config user.name Web3Labs
          git config user.email web3labs@web3labs.com
          git fetch origin gh-pages --depth=1
      - name: Publish only the current main revision
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$CURRENT_MAIN" != "$VALIDATED_SHA" ]]; then
            echo 'A newer main revision exists; leaving publication to its run.'
            exit 0
          fi
          mike deploy --update-aliases "$DOCS_VERSION" latest --push
          mike set-default latest --push
